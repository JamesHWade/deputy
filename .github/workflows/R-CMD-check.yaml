# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

# Stop obsolete branch runs; preserve every main-branch validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  ir-smoke:
    if: github.event_name != 'pull_request'
    name: ir package executable
    runs-on: ubuntu-latest
    env:
      IR_CACHE_DIR: /tmp/deputy-ir-cache
      IR_TOOL_STORE_DIR: /tmp/deputy-ir-tools
      R_USER_CACHE_DIR: /tmp/deputy-r-cache
      IR_NO_MODIFY_PATH: "1"
      RAPP_NO_MODIFY_PATH: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install ir resolver system requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev libssl-dev

      - uses: astral-sh/setup-uv@v6

      - name: Install ir
        run: uv tool install 'r-lib-ir==0.4.0'

      - name: Run the package executable
        run: rx --from . deputy --help

      - name: Install and run a persistent launcher
        run: |
          ir tool install --force --bin-dir "${RUNNER_TEMP}/deputy-bin" .
          "${RUNNER_TEMP}/deputy-bin/deputy" --help

  package-check:
    name: Linux package check
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # The full test suite runs in the shard jobs below.
          args: 'c("--no-manual", "--as-cran", "--no-tests")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  platform-check:
    if: github.event_name != 'pull_request'
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      TESTTHAT_CPUS: 4

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  linux-check:
    # Preserve the existing Linux status as an aggregate, never a tests-free green.
    name: ubuntu-latest (release)
    needs: [package-check, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require package check and every test shard
        env:
          PACKAGE_CHECK: ${{ needs.package-check.result }}
          TESTS: ${{ needs.tests.result }}
        run: test "$PACKAGE_CHECK" = success && test "$TESTS" = success

  tests:
    name: Linux tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TESTTHAT_CPUS: 4
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Run test shard
        run: Rscript .github/scripts/run-tests.R ${{ matrix.shard }} 8

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/deputy-test-results
          if-no-files-found: ignore

      - name: Upload test snapshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots-${{ matrix.shard }}
          path: tests/testthat/_snaps
