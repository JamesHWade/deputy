# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

# Stop obsolete branch runs; preserve every main-branch validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  ir-smoke:
    if: github.event_name != 'pull_request'
    name: ir package executable
    runs-on: ubuntu-latest
    env:
      IR_CACHE_DIR: /tmp/deputy-ir-cache
      IR_TOOL_STORE_DIR: /tmp/deputy-ir-tools
      R_USER_CACHE_DIR: /tmp/deputy-r-cache
      IR_NO_MODIFY_PATH: "1"
      RAPP_NO_MODIFY_PATH: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          Ncpus: 4

      - name: Install ir resolver system requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev libssl-dev

      - uses: astral-sh/setup-uv@v6

      - name: Install ir
        run: uv tool install 'r-lib-ir==0.4.0'

      - name: Run the package executable
        run: rx --from . deputy --help

      - name: Install and run a persistent launcher
        run: |
          ir tool install --force --bin-dir "${RUNNER_TEMP}/deputy-bin" .
          "${RUNNER_TEMP}/deputy-bin/deputy" --help

  R-CMD-check:
    name: ubuntu-latest (release)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      TESTTHAT_CPUS: 4

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          Ncpus: 4

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  platform-check:
    if: github.event_name != 'pull_request'
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      TESTTHAT_CPUS: 4

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          Ncpus: 4

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
