name: Claude Code Review

# Anthropic's documented automatic PR review: claude-code-action running the
# official code-review plugin with --comment. The plugin reports only
# high-confidence findings and skips closed, draft and already-reviewed PRs.
# https://github.com/anthropics/claude-code-action/blob/main/docs/solutions.md
# https://github.com/anthropics/claude-code/tree/main/plugins/code-review

on:
  pull_request:
    # converted_to_draft starts a skipped run that cancels an in-flight review.
    types: [opened, synchronize, ready_for_review, reopened, converted_to_draft]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Same-repository, non-draft PRs only. Fork PRs never receive reviewer
    # credentials; a maintainer reviews them manually.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          # The workflow token lets the action review PRs that edit workflows.
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment'
          claude_args: >-
            --allowedTools "Skill(code-review:code-review),Agent,Task,TodoWrite,Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),mcp__github_inline_comment__create_inline_comment"
