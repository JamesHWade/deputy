# Check formatting without running fork code in a privileged workflow.
on:
  pull_request:

name: format-suggest.yaml

permissions:
  contents: read

jobs:
  format-suggest:
    name: format-suggest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Air
        uses: posit-dev/setup-air@v1

      - name: Check formatting
        run: air format --check .
