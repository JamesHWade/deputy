url: https://jameshwade.github.io/deputy/

template:
  bootstrap: 5
  bootswatch: flatly

search:
  # pkgdown renders every Markdown file in the root, including the files
  # written for coding agents. Keep those out of the site search.
  exclude: [AGENTS.html, CLAUDE.html, CONTEXT.html]

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/getting-started.html

articles:
- title: Get started
  contents:
  - getting-started

- title: Guides
  navbar: Guides
  desc: How each part of an agent works.
  contents:
  - tools
  - permissions
  - hooks
  - approvals
  - structured-output
  - conversations
  - code-execution
  - mcp

- title: Multiple agents
  navbar: Multiple agents
  desc: Hand parts of a task to other agents.
  contents:
  - multi-agent
  - delegation
  - retained-agents

- title: In applications
  navbar: In applications
  desc: Run agents inside Shiny apps, schedulers and monitored services.
  contents:
  - example-shiny-chat
  - background-jobs
  - runtime-integration

- title: Patterns and recipes
  navbar: Patterns and recipes
  desc: Complete worked examples.
  contents:
  - trusted-mini-agents
  - example-data-analysis
  - example-extraction-pipeline
  - example-code-review

